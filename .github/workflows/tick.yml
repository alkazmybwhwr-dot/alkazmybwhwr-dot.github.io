name: tick
on:
  schedule: [{cron: '7 * * * *'}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write}
concurrency: {group: tick, cancel-in_progress: false}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: pull real stats
        env:
          ADSTERRA_API_KEY: ${{ secrets.ADSTERRA_API_KEY }}
        run: python3 tools/pull_stats.py
      - name: commit
        run: |
          git config user.name cinehub-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ) [skip ci]"
          git push
