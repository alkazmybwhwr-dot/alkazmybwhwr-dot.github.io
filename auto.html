</style></head><body><div class="wrap">
<h1>تشغيل تلقائي — شاهد فقط والأرباح ترتفع</h1>
<div class="k">يُشغّل التالي تلقائيًا بعد كل عنصر، ويضيف ربحًا لكل مشاهدة. اتركه مفتوحًا واعمل شغلك.</div>
<div class="p" id="pl">…</div>
<div class="card"><b id="ti">—</b><div class="k" id="meta"></div>
<div class="grid" style="margin-top:8px">
 <div><div class="k">شوهد</div><div class="big" id="n">0</div></div>
 <div><div class="k">ربحت</div><div class="big" id="e">$0.0000</div></div>
 <div><div class="k">التالي بعد</div><div class="big" id="cd">—</div></div>
 <div><div class="k">رصيدك</div><div class="big" id="bal">$0.0000</div></div>
</div>
<div style="margin-top:8px"><button id="tg" onclick="toggle()">▶ ابدأ</button>
<button class="s" onclick="next()">التالي ⟶</button>
<button class="s" onclick="pick('tmdb')">أفلام</button>
<button class="s" onclick="pick('archive')">أرشيف</button>
<button class="s" onclick="pick('dailymotion')">مقاطع</button>
<button class="s" onclick="pick('piped')">يوتيوب</button>
<button class="s" onclick="pick('gutendex')">كتب</button></div>
<div class="k" id="msg"></div></div>
<div class="ch-ad" data-ad="mid"></div>
<p class="k"><a href="/library.html">المكتبة</a> · <a href="/live-dash.html">الأرباح</a> · <a href="/withdraw.html">اسحب</a></p>
</div>
<script src="/ledger.js" defer></script><script src="/beacon.js" defer></script>
<script src="/authtoken.js" defer></script><script src="/ads.js" defer></script><script src="/owner.js" defer></script>
<script>
var LIST=[],i=0,on=false,t=0,iv=null,n=0,earn=0,SRC='tmdb',SEC=45;
function esc(s){return String(s||'').replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]})}
function paint(){document.getElementById('n').textContent=n;document.getElementById('e').textContent='$'+earn.toFixed(4);
 document.getElementById('bal').textContent='$'+(window.CHLedger?CHLedger.balance():0).toFixed(4)}
function pick(s){SRC=s;document.getElementById('msg').textContent='… يحمّل '+s;
 fetch('/data/catalog/'+s+'.json?t='+Date.now()).then(function(r){return r.json()}).then(function(j){
  LIST=(j.items||[]).filter(function(x){return x.emb});shuffle();i=0;document.getElementById('msg').textContent='جاهز: '+LIST.length+' عنصرًا من '+s;show();
 }).catch(function(){document.getElementById('msg').textContent='تعذّر تحميل '+s})}
function shuffle(){for(var k=LIST.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var x=LIST[k];LIST[k]=LIST[r];LIST[r]=x}}
function show(){
 if(!LIST.length){document.getElementById('ti').textContent='لا عناصر — اختر مصدرًا';return}
 if(i>=LIST.length){i=0;shuffle()}
 var x=LIST[i],pl=document.getElementById('pl');
 document.getElementById('ti').textContent=esc(x.t||'');
 document.getElementById('meta').textContent=[x.y,x.g,x.by].filter(Boolean).join(' · ');
 if(x.kind==='video')pl.innerHTML='<video src="'+x.emb+'" controls autoplay muted playsinline poster="'+(x.img||'')+'"></video>';
 else if(x.kind==='image')pl.innerHTML='<img src="'+x.emb+'" style="max-height:56vh">';
 else if(x.kind==='link')pl.innerHTML='<iframe src="'+x.emb+'" loading="lazy"></iframe>';
 else pl.innerHTML='<iframe src="'+x.emb+'" allowfullscreen allow="autoplay; fullscreen" loading="lazy"></iframe>';
 n++;if(window.CHLedger)CHLedger.bonus(0.0008,'autowatch');earn+=0.0008;
 if(window.CHBeacon)CHBeacon.hit('autowatch');
 if(window.CHAds&&CHAds.reload)CHAds.reload();
 document.getElementById('msg').innerHTML='<b style="color:#22c55e">✓ +$0.0008</b> — تابع';
 paint();
 if(on){t=SEC;if(iv)clearInterval(iv);iv=setInterval(function(){t--;document.getElementById('cd').textContent=t+'ث';
  if(t<=0){clearInterval(iv);next()}},1000)}
}
function next(){i++;show()}
function toggle(){on=!on;document.getElementById('tg').textContent=on?'⏸ إيقاف':'▶ ابدأ';if(on)show()}
paint();pick('tmdb');
</script>
